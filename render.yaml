services:
  - type: web
    name: stem-guess
    runtime: python
    plan: free
    # Builds the React client, installs the server and generates the demo songs' audio.
    buildCommand: cd client && npm ci && npm run build && cd ../server && pip install -r requirements.txt && python -m scripts.seed_demo --files-only
    # Registers the demo songs, then serves the client and the game.
    # Game rooms live in memory: keep a single worker/instance.
    startCommand: cd server && python -m scripts.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NODE_VERSION
        value: "22"
      # Postgres connection string, entered in the Render dashboard (e.g. a free Neon database,
      # or an existing Render Postgres: workspaces only get one free Render database).
      - key: DATABASE_URL
        sync: false
